<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Sistem Monitoring Mesin - IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0">Prediksi Maintenance Mesin Industri</h4>
                        <small>Polman Bandung - D4 TRIN</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="/predict" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">1. Temperature (°C)</label>
                                    <input type="number" step="0.1" name="temperature" class="form-control" value="75.2" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">2. Vibration (mm/s)</label>
                                    <input type="number" step="0.1" name="vibration" class="form-control" value="4.8" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">3. Humidity (%)</label>
                                    <input type="number" step="0.1" name="humidity" class="form-control" value="62.1" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">4. Pressure (psi / bar)</label>
                                    <input type="number" step="0.1" name="pressure" class="form-control" value="101.3" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">5. Energy Consumption (kWh)</label>
                                    <input type="number" step="0.1" name="energy_consumption" class="form-control" value="68.5" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold">6. Predicted Remaining Life (Hours)</label>
                                    <input type="number" step="1" name="predicted_remaining_life" class="form-control" value="120" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5 mt-3">Jalankan Analisis AI</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
